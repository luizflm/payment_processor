syntax = "proto3";

package fraud.v1;

// FraudService score payment attempts inside the synchronous
// authorization path. It must answer with the latency budget or the
// caller falls back to rules only mode
option go_package = "github.com/luizflm/payment-processor/proto/gen/go/fraud/v1;fraudv1";

service FraudService {
  rpc Score(ScoreRequest) returns (ScoreResponse);
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_APPROVE = 1;
  VERDICT_DENY = 2;
  VERDICT_MANUAL_REVIEW = 3;
}

message ScoreRequest {
  string payment_id = 1;
  string account_id = 2;
  string card_fingerprint = 3;
  int64 amount_cents = 4;
  string currency = 5;
  string client_ip = 6;
  string merchant_category = 7;
  int64 occurred_at_unix_ms = 8;
}

message ScoreResponse {
  Verdict verdict = 1;
  double risk_score = 2;
  repeated string reasons = 3;
  
  // Degraded is true when the ML stage was skipped by the fallback
  bool degraded = 4;
}
